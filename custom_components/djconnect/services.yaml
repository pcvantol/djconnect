music_dna_import:
  name: Music DNA import
  description: >
    Import a Music DNA export envelope through the same backend path as
    /api/djconnect/v1/music_dna/import. Music DNA must already be enabled for
    the resolved Home Assistant user/client context.
  fields:
    profile:
      name: Profile
      description: Music DNA export envelope or profile payload to import.
      required: true
      selector:
        object:
    music_dna_key:
      name: Music DNA key
      description: Optional Music DNA key to import into.
      required: false
      selector:
        text:
          multiline: false
    client_type:
      name: Client type
      description: Optional DJConnect client type used when resolving Music DNA.
      required: false
      selector:
        text:
          multiline: false
    client_id:
      name: Client ID
      description: Optional app/client install id metadata.
      required: false
      selector:
        text:
          multiline: false
    device_id:
      name: Device ID
      description: Optional DJConnect device/client id.
      required: false
      selector:
        text:
          multiline: false
    device_name:
      name: Device name
      description: Optional display name for the requesting client.
      required: false
      selector:
        text:
          multiline: false
    app_version:
      name: App version
      description: Optional requesting app version metadata.
      required: false
