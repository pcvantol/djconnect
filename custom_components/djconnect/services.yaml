clear_ask_dj_history:
  name: Clear Ask DJ history
  description: >
    Clear server-side Ask DJ history for the authenticated Home Assistant user.
    The backend increases clear_revision and history_revision so clients know
    they must clear local chat cache.
  fields:
    music_dna_key:
      name: Memory key
      description: Music DNA key to clear.
      required: false
      selector:
        text:
          multiline: false
    client_type:
      name: Client type
      description: Optional DJConnect client type used when resolving memory.
      required: false
      selector:
        text:
          multiline: false

ask_dj_history_state:
  name: Ask DJ history state
  description: >
    Return compact Ask DJ history sync state, including history_revision,
    clear_revision and whether a client should clear local chat cache.
  fields:
    music_dna_key:
      name: Memory key
      description: Music DNA key to check.
      required: false
      selector:
        text:
          multiline: false
    history_revision:
      name: History revision
      description: Last Ask DJ history revision known by the client.
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          mode: box
    clear_revision:
      name: Clear revision
      description: Last Ask DJ clear revision known by the client.
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          mode: box

start_spotify_oauth:
  name: Start Spotify OAuth
  description: >
    Developer helper: create a Spotify PKCE authorization URL for the Home
    Assistant Spotify Direct backend. Open the URL, sign in to Spotify, and the
    callback stores the refresh token in DJConnect. This is not used when Music
    Assistant is the selected backend.
  fields:
    client_id:
      name: Spotify Client ID
      description: Spotify Developer App Client ID. Leave empty to use the value from DJConnect options.
      required: false
      selector:
        text:
          multiline: false
    ha_base_url:
      name: Home Assistant external URL
      description: >
        Base URL Spotify can reach after login, preferably your Nabu Casa URL.
        Leave empty to use the URL from DJConnect options. The full redirect URI
        is this URL plus /api/djconnect/v1/spotify/callback.
      required: false
      example: "https://example.ui.nabu.casa"
      selector:
        text:
          multiline: false
    market:
      name: Spotify market
      description: Spotify region for search and playback.
      required: false
      default: NL
      selector:
        select:
          options:
            - NL
            - BE
            - DE
            - FR
            - GB
            - US
          mode: dropdown
    scopes:
      name: Spotify scopes
      description: Spotify OAuth scopes. Leave empty for the default DJConnect scopes.
      required: false
      selector:
        text:
          multiline: true

music_backend_status:
  name: Music backend status
  description: >
    Developer diagnostic: return the selected DJConnect music backend,
    capabilities, revision, target player and safe availability/error metadata.
    Use this to verify Music Assistant selection and target-player readiness
    from Home Assistant Developer Tools without starting playback.
  fields: {}

device_command:
  name: Send device command
  description: >
    Developer helper: send a command to the paired DJConnect device through the
    local /api/device/command endpoint using the stored bearer token.
  fields:
    command:
      name: Command
      description: Local DJConnect command, for example status, next, previous, set_volume, set_output, start_playlist, ask_dj_play_recommendation, set_language or dj_response.
      required: true
      selector:
        text:
          multiline: false
    payload:
      name: Payload
      description: >
        Optional command payload as an object, for example {"value": 35}.
      required: false
      selector:
        object:

queue:
  name: Music queue
  description: >
    Developer diagnostic: return the current selected-backend queue through the
    same command route as /api/djconnect/v1/command with command queue. This
    does not start, stop or mutate playback.
  fields:
    client_type:
      name: Client type
      description: Optional DJConnect client type. Leave empty to use the paired client type.
      required: false
      selector:
        text:
          multiline: false
    client_id:
      name: Client ID
      description: Optional app/client install id metadata.
      required: false
      selector:
        text:
          multiline: false
    device_id:
      name: Device ID
      description: Optional DJConnect device/client id. Leave empty to use the paired client.
      required: false
      selector:
        text:
          multiline: false
    music_dna_key:
      name: Music DNA key
      description: Optional Music DNA key metadata for the queue request context.
      required: false
      selector:
        text:
          multiline: false
    locale:
      name: Locale
      description: Optional response locale, for example en or nl.
      required: false
      selector:
        text:
          multiline: false
    timezone:
      name: Time zone
      description: Optional client time zone.
      required: false
      selector:
        text:
          multiline: false

playlists:
  name: Music playlists
  description: >
    Developer diagnostic: return selected-backend playlists through the same
    command route as /api/djconnect/v1/command with command playlists. This
    does not start, stop or mutate playback.
  fields:
    client_type:
      name: Client type
      description: Optional DJConnect client type. Leave empty to use the paired client type.
      required: false
      selector:
        text:
          multiline: false
    client_id:
      name: Client ID
      description: Optional app/client install id metadata.
      required: false
      selector:
        text:
          multiline: false
    device_id:
      name: Device ID
      description: Optional DJConnect device/client id. Leave empty to use the paired client.
      required: false
      selector:
        text:
          multiline: false
    limit:
      name: Limit
      description: Maximum number of playlists to return.
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 100
          mode: box
    market:
      name: Market
      description: Optional Spotify market hint, for example NL or US.
      required: false
      selector:
        text:
          multiline: false
    music_dna_key:
      name: Music DNA key
      description: Optional Music DNA key metadata for the playlists request context.
      required: false
      selector:
        text:
          multiline: false
    locale:
      name: Locale
      description: Optional response locale, for example en or nl.
      required: false
      selector:
        text:
          multiline: false
    timezone:
      name: Time zone
      description: Optional client time zone.
      required: false
      selector:
        text:
          multiline: false

playback_status:
  name: Playback status
  description: >
    Developer diagnostic: return selected-backend playback status through the
    same command route as /api/djconnect/v1/command with command status. This
    does not mutate playback.
  fields:
    client_type:
      name: Client type
      description: Optional DJConnect client type. Leave empty to use the paired client type.
      required: false
      selector:
        text:
          multiline: false
    device_id:
      name: Device ID
      description: Optional DJConnect device/client id. Leave empty to use the paired client.
      required: false
      selector:
        text:
          multiline: false
    locale:
      name: Locale
      description: Optional response locale, for example en or nl.
      required: false
      selector:
        text:
          multiline: false

playback_devices:
  name: Playback devices
  description: >
    Developer diagnostic: return selected-backend playback outputs/devices
    through the same command route as /api/djconnect/v1/command with command
    devices. This does not mutate playback.
  fields:
    client_type:
      name: Client type
      description: Optional DJConnect client type. Leave empty to use the paired client type.
      required: false
      selector:
        text:
          multiline: false
    device_id:
      name: Device ID
      description: Optional DJConnect device/client id. Leave empty to use the paired client.
      required: false
      selector:
        text:
          multiline: false
    locale:
      name: Locale
      description: Optional response locale, for example en or nl.
      required: false
      selector:
        text:
          multiline: false

playback_command:
  name: Playback command
  description: >
    Developer helper: send a selected-backend playback command through the same
    route as /api/djconnect/v1/command. Use for commands such as play, play_uris,
    pause, next, previous, set_volume, set_output, set_shuffle, set_repeat,
    seek_relative, save_current_track and current-track favorite commands.
  fields:
    command:
      name: Command
      description: Playback command to execute.
      required: true
      selector:
        select:
          custom_value: true
          options:
            - status
            - devices
            - play
            - play_uris
            - pause
            - next
            - previous
            - set_volume
            - set_output
            - set_shuffle
            - set_repeat
            - seek_relative
            - save_current_track
            - set_current_track_favorite
            - toggle_current_track_favorite
          mode: dropdown
    value:
      name: Value
      description: Optional command value. Examples are 40 for set_volume, true for set_shuffle, "off" for set_repeat or {"uris":["spotify:track:..."]} for play_uris.
      required: false
      selector:
        object:
    play:
      name: Start playback
      description: Whether the backend should start playback when the command supports it.
      required: false
      default: false
      selector:
        boolean:
    client_type:
      name: Client type
      description: Optional DJConnect client type. Leave empty to use the paired client type.
      required: false
      selector:
        text:
          multiline: false
    device_id:
      name: Device ID
      description: Optional DJConnect device/client id. Leave empty to use the paired client.
      required: false
      selector:
        text:
          multiline: false
    locale:
      name: Locale
      description: Optional response locale, for example en or nl.
      required: false
      selector:
        text:
          multiline: false

refresh_device_info:
  name: Refresh device info
  description: >
    Developer helper: fetch /api/device/info from the paired DJConnect device and
    update Home Assistant status sensors.
  fields: {}

reboot_device:
  name: Reboot device
  description: >
    Developer helper: ask the paired DJConnect device to reboot through
    /api/device/reboot.
  fields: {}

forget_device:
  name: Forget device pairing
  description: >
    Developer helper: ask the paired DJConnect device to forget its local pairing
    through /api/device/forget. Re-pair the device afterwards.
  fields: {}

profile_export:
  name: Export profile
  description: >
    Export the resolved DJConnect Profile without OAuth tokens, provider secrets,
    Home Assistant tokens, APNs tokens or device tokens.
  fields:
    profile_id:
      name: Profile ID
      description: Optional explicit Profile ID. Device, HA user and fallback resolution are used when omitted.
      required: false
      selector:
        text:
          multiline: false
    include_personal_data:
      name: Include personal data
      description: Include allowed personal references such as Music DNA, mood and likes. Guest-safe/private exports still redact personal state.
      required: false
      default: true
      selector:
        boolean:

household_export:
  name: Export household
  description: >
    Export household Profile Platform metadata, mappings, backend/account metadata
    and non-secret configuration. Provider credentials must be re-linked after import.
  fields:
    profile_id:
      name: Profile ID
      description: Optional Profile ID used only for profile resolution/authorization context.
      required: false
      selector:
        text:
          multiline: false

integration_export:
  name: Export integration
  description: >
    Export a full non-secret DJConnect integration envelope. Secrets are excluded
    by default and explicitly marked as excluded in the response.
  fields:
    profile_id:
      name: Profile ID
      description: Optional Profile ID used only for profile resolution/authorization context.
      required: false
      selector:
        text:
          multiline: false

profile_import:
  name: Import profile
  description: >
    Import a single DJConnect Profile export. Secret-like fields are rejected and
    provider accounts must be re-linked where credentials are missing.
  fields:
    export:
      name: Export
      description: Profile export envelope.
      required: true
      selector:
        object:
    overwrite:
      name: Overwrite
      description: Allow replacing an existing profile with the same ID.
      required: false
      default: false
      selector:
        boolean:
    reassign_id:
      name: Reassign ID
      description: Create a new imported Profile ID when the export ID already exists.
      required: false
      default: false
      selector:
        boolean:

household_import:
  name: Import household
  description: >
    Import a household or full non-secret integration export. Existing profiles
    are not overwritten unless overwrite is true.
  fields:
    export:
      name: Export
      description: Household or integration export envelope.
      required: true
      selector:
        object:
    overwrite:
      name: Overwrite
      description: Allow replacing the existing Profile Platform household state.
      required: false
      default: false
      selector:
        boolean:

clear_profile_state:
  name: Clear profile state
  description: >
    Clear selected personal state for the resolved Profile without deleting the Profile.
  fields:
    profile_id:
      name: Profile ID
      description: Optional explicit Profile ID. Device, HA user and fallback resolution are used when omitted.
      required: false
      selector:
        text:
          multiline: false
    ask_dj:
      name: Ask DJ history
      description: Clear Ask DJ conversation references/history for this context.
      required: false
      default: false
      selector:
        boolean:
    music_dna:
      name: Music DNA
      description: Reset Music DNA references/data for this context.
      required: false
      default: false
      selector:
        boolean:
    recommendations:
      name: Recommendations
      description: Clear recommendation references, likes and dislikes.
      required: false
      default: false
      selector:
        boolean:
    mood:
      name: Mood
      description: Clear durable mood state.
      required: false
      default: false
      selector:
        boolean:
    all:
      name: All personal state
      description: Clear all personal state references without deleting the Profile.
      required: false
      default: false
      selector:
        boolean:
