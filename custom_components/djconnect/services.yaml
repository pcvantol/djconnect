test_parse:
  name: Test Assist parser
  description: >
    Developer test: send text through the configured Home Assistant Assist
    conversation pipeline and return the DJConnect intent. This action does not
    start playback on Spotify Direct or Music Assistant and does not send a DJ
    announcement.
  fields:
    command_text:
      name: Command text
      description: Text as the DJConnect device would send it after HA Assist STT. Current-track questions and playback controls are handled by Home Assistant through the selected music backend without client-side provider credentials.
      example: "Welk nummer draait er nu?"
      required: true
      selector:
        text:
          multiline: false

test_tts:
  name: Test DJ announcement
  description: >
    Developer test: send a standalone DJ announcement to the paired DJConnect
    device. Home Assistant tries to create a temporary WAV or MP3 audio_url through
    the configured TTS engine; if that fails, DJConnect sends text only so the
    device can display the announcement.
  fields:
    dj_response_text:
      name: DJ announcement text
      description: Text the DJConnect device should display and speak when possible.
      example: "Daar gaan we. DJConnect is gekoppeld, de stem werkt, en ik sta klaar voor je volgende plaat."
      required: true
      selector:
        text:
          multiline: true

test_command:
  name: Test full text command
  description: >
    Developer test: use the same text-command route as the DJConnect device.
    Text goes through Home Assistant to a DJConnect intent, can optionally start
    playback through Spotify Direct or Music Assistant, and then sends the DJ
    announcement to the ESP device.
    Current-track questions and direct playback controls are handled by Home
    Assistant without client-side provider credentials or playback backend logic.
  fields:
    command_text:
      name: Command text
      description: Music request, current-track question or playback-control text.
      example: "Stop muziek"
      required: true
      selector:
        text:
          multiline: false
    play:
      name: Start playback
      description: Turn off to test parser/result data without starting playback on the selected backend.
      required: false
      default: true
      selector:
        boolean:

test_ptt_text:
  name: Test PTT text flow
  description: >
    Developer test: start exactly after STT conversion. Enter the natural
    language sentence the user said; DJConnect runs intent parsing, selected
    backend search/playback where supported, DJ announcement generation with
    text/audio, and sends the result back to the connected DJConnect
    device/client.
  fields:
    command_text:
      name: Natural language text
      description: Text as recognized by STT from a PTT voice request.
      example: "Wat speelt er?"
      required: true
      selector:
        text:
          multiline: false

test_apns_push:
  name: Test APNs push
  description: >
    Developer diagnostic: inspect DJConnect APNs push readiness for iOS, macOS
    or Apple Watch clients. By default this returns decision, relay, registration
    and last error details without sending a push. Set send to true to attempt a
    privacy-safe test push through the DJConnect central relay.
  fields:
    device_id:
      name: Device ID
      description: Optional DJConnect Apple client id. Leave empty to use the paired client.
      example: "djconnect-macos-ABCDEFGHIJKL"
      required: false
      selector:
        text:
          multiline: false
    client_type:
      name: Client type
      description: ios, macos or watchos. Leave empty to use the paired client type.
      example: "macos"
      required: false
      selector:
        select:
          options:
            - ios
            - macos
            - watchos
          mode: dropdown
    event_type:
      name: Event type
      description: Push event to test.
      required: false
      default: ask_dj_confirm
      selector:
        select:
          options:
            - ask_dj_confirm
            - ask_dj_response
          mode: dropdown
    user_id:
      name: User ID
      description: Optional HA user id for the same user-scoped push path as Ask DJ.
      required: false
      selector:
        text:
          multiline: false
    send:
      name: Send push
      description: Turn on to actually call the central relay; leave off for diagnostic dry-run.
      required: false
      default: false
      selector:
        boolean:
    explicit_user_request:
      name: Explicit user request
      description: Leave on for manual tests so Ask DJ push policy allows the event when otherwise valid.
      required: false
      default: true
      selector:
        boolean:

ask_dj:
  name: Ask DJ
  description: >
    Ask DJ text request for iOS, macOS, Apple Watch, Raspberry Pi and Windows
    clients. Home Assistant
    handles intent routing, Music DNA, selected-backend/Home Assistant actions
    and informational answers. Responses can include text, audio_url, images,
    links, intent, action and music_dna_key. Spotify-only questions gracefully
    degrade when Music Assistant is selected.
  fields:
    text:
      name: Text
      description: Ask DJ chat text.
      example: "Waarom koos je dit nummer?"
      required: true
      selector:
        text:
          multiline: true
    music_dna_key:
      name: Memory key
      description: Optional client-suggested Music DNA key. Home Assistant may normalize it.
      required: false
      selector:
        text:
          multiline: false
    client_type:
      name: Client type
      description: DJConnect client type such as ios, macos, watchos, raspberry_pi or windows.
      required: false
      selector:
        text:
          multiline: false
    mood:
      name: Mood
      description: Optional mood/energy value from 0 to 100.
      required: false
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    dj_style:
      name: DJ style
      description: Optional Ask DJ style hint.
      required: false
      selector:
        text:
          multiline: false

track_insight:
  name: Track Insight
  description: >
    Analyze the currently playing track or an explicit artist/title through the
    selected DJConnect music backend. The service returns normalized Track
    Insight JSON with Music DNA Match and visual-profile hints, then fires the
    djconnect_track_insight event for automations and dashboards.
  fields:
    entity_id:
      name: Entity ID
      description: Optional media_player entity to inspect for now-playing metadata.
      required: false
      selector:
        entity:
          domain: media_player
    player_id:
      name: Player ID
      description: Optional backend/player identifier.
      required: false
      selector:
        text:
          multiline: false
    title:
      name: Track title
      description: Optional explicit track title. Provide artist too to analyze a track without now-playing metadata.
      required: false
      selector:
        text:
          multiline: false
    artist:
      name: Artist
      description: Optional explicit artist name.
      required: false
      selector:
        text:
          multiline: false
    album:
      name: Album
      description: Optional album name for identity, cache and visual seed.
      required: false
      selector:
        text:
          multiline: false
    music_backend:
      name: Music backend
      description: Optional backend hint for cache identity and explicit-track analysis.
      required: false
      selector:
        text:
          multiline: false
    force_refresh:
      name: Force refresh
      description: Ignore cached insight and request a fresh analysis.
      required: false
      default: false
      selector:
        boolean:
    include_visual_profile:
      name: Include visual profile
      description: Include deterministic visualization hints for clients.
      required: false
      default: true
      selector:
        boolean:
    include_raw_response:
      name: Include raw response
      description: Include the raw AI response for developer diagnostics.
      required: false
      default: false
      selector:
        boolean:
    locale:
      name: Locale
      description: Optional response locale, for example en or nl.
      required: false
      selector:
        text:
          multiline: false

music_dna_profile:
  name: Music DNA profile
  description: >
    Return the current structured Music DNA profile for a user/client context.
    If Music DNA is not enabled, the profile is empty and enabled is false.
  fields:
    music_dna_key:
      name: Music DNA key
      description: Optional Music DNA key to inspect.
      required: false
      selector:
        text:
          multiline: false
    client_type:
      name: Client type
      description: Optional DJConnect client type used when resolving Music DNA.
      required: false
      selector:
        text:
          multiline: false

set_music_dna_enabled:
  name: Set Music DNA enabled
  description: >
    Opt a user/client context in or out of Music DNA. Disabling Music DNA clears
    learned Music DNA knowledge and stops future knowledge collection.
  fields:
    enabled:
      name: Enabled
      description: Whether Music DNA may build knowledge for this context.
      required: true
      selector:
        boolean:
    music_dna_key:
      name: Music DNA key
      description: Optional Music DNA key to update.
      required: false
      selector:
        text:
          multiline: false
    client_type:
      name: Client type
      description: Optional DJConnect client type used when resolving Music DNA.
      required: false
      selector:
        text:
          multiline: false

clear_music_dna:
  name: Clear Music DNA
  description: >
    Clear learned Music DNA knowledge for the resolved user/client context while
    preserving the current opt-in setting.
  fields:
    music_dna_key:
      name: Music DNA key
      description: Optional Music DNA key to clear.
      required: false
      selector:
        text:
          multiline: false
    client_type:
      name: Client type
      description: Optional DJConnect client type used when resolving Music DNA.
      required: false
      selector:
        text:
          multiline: false

clear_ask_dj_history:
  name: Clear Ask DJ history
  description: >
    Clear server-side Music DNA/Ask DJ history for a memory key and mark the
    history generation so other clients know they must clear local chat cache.
  fields:
    music_dna_key:
      name: Memory key
      description: Music DNA key to clear.
      required: false
      selector:
        text:
          multiline: false
    client_type:
      name: Client type
      description: Optional DJConnect client type used when resolving memory.
      required: false
      selector:
        text:
          multiline: false

ask_dj_history_state:
  name: Ask DJ history state
  description: >
    Return whether a client should clear local Ask DJ chat history before
    showing the Ask DJ screen.
  fields:
    music_dna_key:
      name: Memory key
      description: Music DNA key to check.
      required: false
      selector:
        text:
          multiline: false
    generation:
      name: Generation
      description: Last Ask DJ history generation known by the client.
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          mode: box

start_spotify_oauth:
  name: Start Spotify OAuth
  description: >
    Developer helper: create a Spotify PKCE authorization URL for the Home
    Assistant Spotify Direct backend. Open the URL, sign in to Spotify, and the
    callback stores the refresh token in DJConnect. This is not used when Music
    Assistant is the selected backend.
  fields:
    client_id:
      name: Spotify Client ID
      description: Spotify Developer App Client ID. Leave empty to use the value from DJConnect options.
      required: false
      selector:
        text:
          multiline: false
    ha_base_url:
      name: Home Assistant external URL
      description: >
        Base URL Spotify can reach after login, preferably your Nabu Casa URL.
        Leave empty to use the URL from DJConnect options. The full redirect URI
        is this URL plus /api/djconnect/spotify/callback.
      required: false
      example: "https://example.ui.nabu.casa"
      selector:
        text:
          multiline: false
    market:
      name: Spotify market
      description: Spotify region for search and playback.
      required: false
      default: NL
      selector:
        select:
          options:
            - NL
            - BE
            - DE
            - FR
            - GB
            - US
          mode: dropdown
    scopes:
      name: Spotify scopes
      description: Spotify OAuth scopes. Leave empty for the default DJConnect scopes.
      required: false
      selector:
        text:
          multiline: true

music_backend_status:
  name: Music backend status
  description: >
    Developer diagnostic: return the selected DJConnect music backend,
    capabilities, revision, target player and safe availability/error metadata.
    Use this to verify Music Assistant selection and target-player readiness
    from Home Assistant Developer Tools without starting playback.
  fields: {}

device_command:
  name: Send device command
  description: >
    Developer helper: send a command to the paired DJConnect device through the
    local /api/device/command endpoint using the stored bearer token.
  fields:
    command:
      name: Command
      description: Local DJConnect command, for example status, next, previous, set_volume, set_output, start_playlist, ask_dj_play_recommendation, set_language or dj_response.
      required: true
      selector:
        text:
          multiline: false
    payload:
      name: Payload
      description: >
        Optional command payload as an object, for example {"value": 35}.
      required: false
      selector:
        object:

refresh_device_info:
  name: Refresh device info
  description: >
    Developer helper: fetch /api/device/info from the paired DJConnect device and
    update Home Assistant status sensors.
  fields: {}

reboot_device:
  name: Reboot device
  description: >
    Developer helper: ask the paired DJConnect device to reboot through
    /api/device/reboot.
  fields: {}

forget_device:
  name: Forget device pairing
  description: >
    Developer helper: ask the paired DJConnect device to forget its local pairing
    through /api/device/forget. Re-pair the device afterwards.
  fields: {}
