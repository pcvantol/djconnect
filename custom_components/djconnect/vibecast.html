<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>DJConnect VibeCast</title>
<style>
:root{color-scheme:dark;--accent:#9f7cff;--art:none}*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;overflow:hidden}body{min-height:100vh;min-height:100dvh;background:#12111c;color:#f8f6ff;font-family:system-ui,sans-serif}.atmosphere,.atmosphere::after{position:fixed;inset:-12vmax;pointer-events:none}.atmosphere{background:radial-gradient(circle at 15% 12%,color-mix(in srgb,var(--accent) 65%,transparent),transparent 32%),radial-gradient(circle at 85% 88%,#355e87,transparent 38%),#12111c;animation:drift 24s ease-in-out infinite alternate}.atmosphere::after{content:"";background:var(--art) center/cover;opacity:.18;filter:blur(72px) saturate(1.25);transform:scale(1.2)}main{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(2rem,6vw,6rem)}header{display:flex;justify-content:space-between;gap:1rem;font-size:clamp(.75rem,1.1vw,1rem);letter-spacing:.16em;text-transform:uppercase;color:#d9d4e9}#state{color:#fff;letter-spacing:.08em}.stage{align-self:center;width:min(100%,62rem)}.eyebrow{margin:0 0 1rem;color:#dfd5ff;font-size:clamp(.8rem,1.4vw,1.15rem);font-weight:700;letter-spacing:.13em;text-transform:uppercase}.artwork{width:min(58vw,26rem);aspect-ratio:1;border-radius:2rem;object-fit:cover;box-shadow:0 2rem 6rem #0008;background:#262137}.track{margin:clamp(1.75rem,4vh,3.5rem) 0 0;font-size:clamp(2rem,5.5vw,5.8rem);line-height:.96;letter-spacing:-.045em;max-width:15ch}.artist{margin:.8rem 0 0;color:#ebe7f5;font-size:clamp(1.1rem,2.2vw,2rem)}.moment{margin:clamp(1.5rem,4vh,3rem) 0 0;max-width:45rem;color:#fff;font-size:clamp(1.1rem,2vw,1.8rem);line-height:1.3}.moment:empty{display:none}footer{display:grid;gap:.75rem;color:#e1ddeb}progress{width:100%;height:.35rem;accent-color:var(--accent)}.meta{display:flex;justify-content:space-between;gap:1rem;font-size:clamp(.8rem,1.2vw,1rem)}.idle .stage{opacity:.76}@keyframes drift{from{transform:translate3d(-1%,-1%,0) scale(1)}to{transform </style></head><body class="idle"><div class="atmosphere" aria-hidden="true"></div><main><header><span>DJConnect VibeCast</span><span id="state" data-testid="connection-state">Idle</span></header><section class="stage" aria-live="polite"><img id="artwork" class="artwork" alt="" hidden><div><p id="mood" class="eyebrow">Ambient session</p><h1 id="title" class="track">Waiting for a session</h1><p id="artist" class="artist"></p></div><p id="moment" class="moment"></p></section><footer><progress id="progress" max="1" value="0" hidden></progress><div class="meta"><span id="album"></span><span id="time"></span></div></footer></main>
<script>(()=>{const params=new URLSearchParams(window.location.search),sessionId=params.get("session_id"),broadcastToken=params.get("broadcast_token"),e=id=>document.getElementById(id),root=document.documentElement,copy={en:{idle:"Idle",connecting:"Connecting",live:"Live",unavailable:"No active session",waiting:"Waiting for a session",ambient:"Ambient session"},nl:{idle:"Inactief",connecting:"Verbinden",live:"Live",unavailable:"Geen actieve sessie",waiting:"Wachten op een sessie",ambient:"Ambient sessie"}},text=copy[(navigator.language||"en").slice(0,2)]||copy.en;let projection={},socket,reconnectTimer,attempts=0,ended=false;const playback=()=>projection.playback&&typeof projection.playback==="object"?projection.playback:{},moment=()=>{const v=Array.isArray(projection.dj_moments)?projection.dj_moments:[];return v.at(-1)||null},format=v=>Number.isFinite(v)&&v>=0?`${Math.floor(v/60000)}:${String(Math.floor(v/1000)%60).padStart(2,"0")}`:"",theme=m=>({chill:"#7d8dff",groove:"#c07dff",energy:"#ff806b",party:"#ffce55"}[m]||"#9f7cff");function render(){const p=playback(),m=moment(),mood=projection.session&&projection.session.selected_mood,art=p.artwork_url||(m&&m.artwork&&m.artwork.url)||"";document.body.classList.toggle("idle",!p.title);e("mood").textContent=mood||text.ambient;e("title").textContent=p.title||text.waiting;e("artist").textContent=p.artist||"";e("album").textContent=p.album||"";e("moment").textContent=m&&(m.summary||m.content||m.title)||"";e("artwork").hidden=!art;e("artwork").src=art;e("artwork").alt=art?(p.album||p.title||""):"";root.style.setProperty("--art",art?`url("${art.replaceAll('"','%22')}")`:"none");root.style.setProperty("--accent",theme(mood));const active=Number.isFinite(p.duration_ms)&&Number.isFinite(p.position_ms)&&p.duration_ms>0;e("progress").hidden=!active;if(active){e("progress").max=p.duration_ms;e("progress").value=p.position_ms;e("time").textContent=`${format(p.position_ms)} / ${format(p.duration_ms)}`}else e("time").textContent=""}function apply(s){projection=s&&typeof s==="object"?s:{};render()}function event(frame){const p=frame&&frame.payload;if(!p||typeof p!=="object")return;if(frame.event_type==="runtime_ended"||frame.event_type==="broadcast_stopped"){ended=true;apply({});e("state").textContent=text.idle;return}for(const key of["session","playback","planner","session_flow","audience","broadcast"])if(p[key])projection[key]=p[key];if(p.dj_moment)projection.dj_moments=[...(projection.dj_moments||[]),p.dj_moment];render()}const url=()=>`${window.location.protocol==="https:"?"wss:":"ws:"}//${window.location.host}/api/djconnect/v1/session/broadcast/ws/${encodeURIComponent(sessionId)}?broadcast_token=${encodeURIComponent(broadcastToken)}`;function connect(){if(ended)return;e("state").textContent=text.connecting;const active=new WebSocket(url());socket=active;active.onopen=()=>{attempts=0;e("state").textContent=text.live};active.onmessage=({data})=>{try{const f=JSON.parse(data);if(f.type==="snapshot")apply(f.snapshot);else if(f.type==="event")event(f.data);else if(f.type==="error"){ended=true;e("state").textContent=text.unavailable}}catch(_){}};active.onclose=()=>{if(!ended&&!reconnectTimer)reconnectTimer=window.setTimeout(()=>{reconnectTimer=undefined;attempts++;connect()},Math.min(1000*2**attempts,5000))};active.onerror=()=>active.close()}e("state").textContent=text.idle;e("title").textContent=text.waiting;e("mood").textContent=text.ambient;if(sessionId&&broadcastToken)connect();else e("state").textContent=text.unavailable;window.addEventListener("beforeunload",()=>{ended=true;if(socket)socket.close()})})()</script></body></html>
