name: Deploy Home Assistant integration through private relay

on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        options: [deployment]
      candidate_sha:
        required: true
        type: string
      execution_mode:
        required: true
        type: choice
        options: [execute]
      manifest_id:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      artifact_sha256:
        required: true
        type: string
      target:
        required: true
        type: choice
        options: [home_assistant_pi5]
      platform_version:
        required: true
        type: string
      release_profile:
        required: true
        type: choice
        options: [INTERNAL_RELEASE]

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, macOS, ARM64, internal-release, private-network-deployment]
    environment: private-network-deployment
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate manifest-bound deployment request
        env:
          ACTION: ${{ inputs.action }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXECUTION_MODE: ${{ inputs.execution_mode }}
          MANIFEST_ID: ${{ inputs.manifest_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          TARGET: ${{ inputs.target }}
          PLATFORM_VERSION: ${{ inputs.platform_version }}
          RELEASE_PROFILE: ${{ inputs.release_profile }}
        run: |
          set -euo pipefail
          test "$ACTION" = deployment
          test "$EXECUTION_MODE" = execute
          test "$TARGET" = home_assistant_pi5
          test "$RELEASE_PROFILE" = INTERNAL_RELEASE
          printf '%s' "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$MANIFEST_ID" | grep -Eq '^release-[A-Za-z0-9._-]+$'
          printf '%s' "$ARTIFACT_ID" | grep -Eq '^[0-9]+$'
          printf '%s' "$ARTIFACT_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s' "$PLATFORM_VERSION" | grep -Eq '^[0-9]+\.[0-9]+$'
      - name: Verify target deployment readiness
        uses: pcvantol/djconnect/.github/actions/deployment-readiness-preflight@962609ad77668c615b00c88b22167ed6b20bffc3
        with:
          target: ${{ inputs.target }}
          manifest_id: ${{ inputs.manifest_id }}
          candidate_sha: ${{ inputs.candidate_sha }}
          artifact_id: ${{ inputs.artifact_id }}
          artifact_sha256: ${{ inputs.artifact_sha256 }}
          expected_runner_os: macOS
          expected_runner_arch: ARM64
          required_configuration: HAOS_HOST,HAOS_PORT,HAOS_USER,HAOS_SSH_PRIVATE_KEY,HAOS_SSH_KNOWN_HOSTS
          smoke_contract: home-assistant-private-relay-smoke-v1
        env:
          HAOS_HOST: ${{ secrets.DJCONNECT_HA_OS_DEPLOY_HOST }}
          HAOS_PORT: ${{ secrets.DJCONNECT_HA_OS_DEPLOY_PORT }}
          HAOS_USER: ${{ secrets.DJCONNECT_HA_OS_DEPLOY_USER }}
          HAOS_SSH_PRIVATE_KEY: ${{ secrets.DJCONNECT_HA_OS_DEPLOY_SSH_PRIVATE_KEY }}
          HAOS_SSH_KNOWN_HOSTS: ${{ secrets.DJCONNECT_HA_OS_DEPLOY_SSH_KNOWN_HOSTS }}
      - name: Require approved central operational manifest source
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MANIFEST_ID: ${{ inputs.manifest_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          TARGET: ${{ inputs.target }}
          RELEASE_PROFILE: ${{ inputs.release_profile }}
        run: |
          set -euo pipefail
          manifest="$(mktemp)"
          trap 'rm -f "$manifest"' EXIT
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/pcvantol/djconnect/main/docs/release/PLATFORM_3_3_CURRENT_MAIN_MANIFEST_PROPOSAL.json \
            --output "$manifest"
          manifest_status="$(jq -r '.status' "$manifest")"
          case "$manifest_status" in
            APPROVED_DEPLOYMENT_DISPATCH_PENDING|APPROVED_PARTIAL_DEPLOYMENT_OPERATIONAL) ;;
            *) echo "Manifest is not open for an authorized target deployment: $manifest_status" >&2; exit 1 ;;
          esac
          test "$(jq -r '.approval.state' "$manifest")" = APPROVED
          test "$(jq -r '.manifest_id' "$manifest")" = "$MANIFEST_ID"
          test "$(jq -r '.release_profile' "$manifest")" = "$RELEASE_PROFILE"
          jq -e --arg sha "$CANDIDATE_SHA" \
            '.repositories[] | select(.repository == "pcvantol/djconnect" and .source_sha == $sha)' \
            "$manifest" >/dev/null
          jq -e --arg target "$TARGET" --arg artifact "$ARTIFACT_ID" --arg sha "$ARTIFACT_SHA256" \
            '.artifact_bindings[] | select(.target == $target and (.artifact_id | tostring) == $artifact and .artifact_sha256 == $sha)' \
            "$manifest" >/dev/null
      - id: haos-transport
        name: Configure restricted Home Assistant OS SSH transport
        env:
          HAOS_HOST: ${{ secrets.DJCONNECT_HA_OS_DEPLOY_HOST }}
          HAOS_PORT: ${{ secrets.DJCONNECT_HA_OS_DEPLOY_PORT }}
          HAOS_USER: ${{ secrets.DJCONNECT_HA_OS_DEPLOY_USER }}
          HAOS_SSH_PRIVATE_KEY: ${{ secrets.DJCONNECT_HA_OS_DEPLOY_SSH_PRIVATE_KEY }}
          HAOS_SSH_KNOWN_HOSTS: ${{ secrets.DJCONNECT_HA_OS_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          printf '%s' "$HAOS_HOST" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.-]*$'
          printf '%s' "$HAOS_PORT" | grep -Eq '^[0-9]{1,5}$'
          printf '%s' "$HAOS_USER" | grep -Eq '^[A-Za-z_][A-Za-z0-9_-]*$'
          test -n "$HAOS_SSH_PRIVATE_KEY"
          test -n "$HAOS_SSH_KNOWN_HOSTS"
          transport_dir="$RUNNER_TEMP/djconnect-haos-ssh-${GITHUB_RUN_ID}"
          umask 077
          mkdir -p "$transport_dir"
          printf '%s\n' "$HAOS_SSH_PRIVATE_KEY" >"$transport_dir/id_ed25519"
          printf '%s\n' "$HAOS_SSH_KNOWN_HOSTS" >"$transport_dir/known_hosts"
          chmod 600 "$transport_dir/id_ed25519" "$transport_dir/known_hosts"
          printf 'path=%s\n' "$transport_dir" >> "$GITHUB_OUTPUT"
      - name: Validate Home Assistant OS target scope after authorization
        env:
          HAOS_HOST: ${{ secrets.DJCONNECT_HA_OS_DEPLOY_HOST }}
          HAOS_PORT: ${{ secrets.DJCONNECT_HA_OS_DEPLOY_PORT }}
          HAOS_USER: ${{ secrets.DJCONNECT_HA_OS_DEPLOY_USER }}
          SSH_TRANSPORT_PATH: ${{ steps.haos-transport.outputs.path }}
        run: |
          set -euo pipefail
          ssh=(ssh -i "$SSH_TRANSPORT_PATH/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_TRANSPORT_PATH/known_hosts" -p "$HAOS_PORT" "$HAOS_USER@$HAOS_HOST")
          "${ssh[@]}" 'set -eu; test -d /config; test -d /config/custom_components; command -v ha >/dev/null; ha core info --raw-json >/dev/null'
      - id: artifact
        name: Verify immutable artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          test "$(jq -r '.expired' <<<"$metadata")" = false
          run_id="$(jq -r '.workflow_run.id' <<<"$metadata")"
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$(jq -r '.head_branch' <<<"$run")" = main
          test "$(jq -r '.head_sha' <<<"$run")" = "$CANDIDATE_SHA"
          test "$(jq -r '.name' <<<"$run")" = 'Home Assistant release artifact'
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
      - name: Download manifest-bound artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.artifact.outputs.run_id }}
          path: artifact
      - name: Install exact integration artifact and restart Home Assistant OS Core
        env:
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          HAOS_HOST: ${{ secrets.DJCONNECT_HA_OS_DEPLOY_HOST }}
          HAOS_PORT: ${{ secrets.DJCONNECT_HA_OS_DEPLOY_PORT }}
          HAOS_USER: ${{ secrets.DJCONNECT_HA_OS_DEPLOY_USER }}
          SSH_TRANSPORT_PATH: ${{ steps.haos-transport.outputs.path }}
        run: |
          set -euo pipefail
          mapfile -t release_artifacts < <(find artifact -type f -name djconnect-home-assistant-integration.tar.gz -print)
          test "${#release_artifacts[@]}" -eq 1
          release_artifact="${release_artifacts[0]}"
          test "$(shasum -a 256 "$release_artifact" | awk '{print $1}')" = "$ARTIFACT_SHA256"
          local_staging="$(mktemp -d)"
          trap 'rm -rf "$local_staging"' EXIT
          tar -xzf "$release_artifact" -C "$local_staging"
          python3 -m json.tool "$local_staging/djconnect/manifest.json" >/dev/null
          remote_artifact="/config/.djconnect-release-${GITHUB_RUN_ID}.tar.gz"
          ssh=(ssh -i "$SSH_TRANSPORT_PATH/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_TRANSPORT_PATH/known_hosts" -p "$HAOS_PORT" "$HAOS_USER@$HAOS_HOST")
          "${ssh[@]}" "cat > '$remote_artifact'" <"$release_artifact"
          "${ssh[@]}" "set -euf
          archive='$remote_artifact'
          expected_sha='$ARTIFACT_SHA256'
          workdir=\"/config/.djconnect-release-${GITHUB_RUN_ID}\"
          staging=\"/config/custom_components/.djconnect-staging-${GITHUB_RUN_ID}\"
          target=/config/custom_components/djconnect
          backup=\"/config/custom_components/.djconnect-pre-${GITHUB_RUN_ID}\"
          trap 'rm -rf \"\$workdir\" \"\$staging\"; rm -f \"\$archive\"' EXIT
          test \"\$(sha256sum \"\$archive\" | awk '{print \$1}')\" = \"\$expected_sha\"
          rm -rf \"\$workdir\" \"\$staging\"
          mkdir -p \"\$workdir\" /config/custom_components
          tar -xzf \"\$archive\" -C \"\$workdir\"
          test -f \"\$workdir/djconnect/manifest.json\"
          mv \"\$workdir/djconnect\" \"\$staging\"
          test ! -e \"\$backup\"
          if test -e \"\$target\"; then mv \"\$target\" \"\$backup\"; fi
          mv \"\$staging\" \"\$target\"
          ha core check
          ha core restart"
      - name: Publish redacted deployment evidence
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MANIFEST_ID: ${{ inputs.manifest_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          TARGET: ${{ inputs.target }}
          PLATFORM_VERSION: ${{ inputs.platform_version }}
          RELEASE_PROFILE: ${{ inputs.release_profile }}
          DEPLOYMENT_WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          python - <<'PY'
          from datetime import UTC, datetime
          import json, os
          with open("ha-private-deployment-evidence.json", "w", encoding="utf-8") as file:
              json.dump({"schema_version": 1, "kind": "home_assistant_private_deployment", "repository": os.environ["GITHUB_REPOSITORY"], "candidate_sha": os.environ["CANDIDATE_SHA"], "manifest_id": os.environ["MANIFEST_ID"], "artifact_id": os.environ["ARTIFACT_ID"], "artifact_sha256": os.environ["ARTIFACT_SHA256"], "target": os.environ["TARGET"], "platform_version": os.environ["PLATFORM_VERSION"], "release_profile": os.environ["RELEASE_PROFILE"], "deployment_workflow_run": os.environ["DEPLOYMENT_WORKFLOW_RUN"], "deployment_result": "DEPLOYED_PENDING_SMOKE", "timestamp": datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z")}, file, sort_keys=True)
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ha-private-deployment-evidence
          path: ha-private-deployment-evidence.json
          if-no-files-found: error
      - name: Remove Home Assistant OS SSH transport material
        if: always()
        env:
          SSH_TRANSPORT_PATH: ${{ steps.haos-transport.outputs.path }}
        run: |
          set -euo pipefail
          test -z "$SSH_TRANSPORT_PATH" || rm -rf "$SSH_TRANSPORT_PATH"
