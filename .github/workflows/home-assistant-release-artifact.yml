name: Home Assistant release artifact

on:
  workflow_run:
    workflows: [Validate Home Assistant custom integration]
    types: [completed]

concurrency:
  group: ha-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paid-contextual-golden:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    uses: ./.github/workflows/askdj-contextual-release-gate.yml
    permissions:
      contents: read
    with:
      candidate_sha: ${{ github.event.workflow_run.head_sha }}
    secrets:
      DJCONNECT_GOLDEN_OPENAI_API_KEY: ${{ secrets.DJCONNECT_GOLDEN_OPENAI_API_KEY }}

  package:
    needs: paid-contextual-golden
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - name: Package the exact integration artifact
        run: |
          set -euo pipefail
          tar -C custom_components --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - djconnect | gzip -n > djconnect-home-assistant-integration.tar.gz
          sha256sum djconnect-home-assistant-integration.tar.gz | awk '{print $1}' > djconnect-home-assistant-integration.sha256
      - id: release
        name: Publish immutable release asset
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="internal-ha-${CANDIDATE_SHA}"
          asset="djconnect-home-assistant-integration-${CANDIDATE_SHA}.tar.gz"
          mv djconnect-home-assistant-integration.tar.gz "$asset"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$CANDIDATE_SHA" --title "DJConnect Home Assistant artifact ${CANDIDATE_SHA}" --prerelease --notes "Immutable internal deployment artifact."
          test "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" = "$CANDIDATE_SHA"
          mkdir -p immutable-readback
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx "$asset"; then
            gh release download "$tag" --pattern "$asset" --dir immutable-readback
            test "$(sha256sum "immutable-readback/$asset" | awk '{print $1}')" = "$(cat djconnect-home-assistant-integration.sha256)"
          else
            gh release upload "$tag" "$asset"
            gh release download "$tag" --pattern "$asset" --dir immutable-readback
            test "$(sha256sum "immutable-readback/$asset" | awk '{print $1}')" = "$(cat djconnect-home-assistant-integration.sha256)"
          fi
          printf 'asset=%s\n' "$asset" >> "$GITHUB_OUTPUT"
          printf 'artifact_id=release-asset:%s:%s:%s\n' "$GITHUB_REPOSITORY" "$tag" "$asset" >> "$GITHUB_OUTPUT"
          printf 'artifact_url=https://github.com/%s/releases/download/%s/%s\n' "$GITHUB_REPOSITORY" "$tag" "$asset" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: djconnect-home-assistant-integration-${{ github.event.workflow_run.head_sha }}
          path: ${{ steps.release.outputs.asset }}
          if-no-files-found: error
      - name: Publish artifact evidence
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          ARTIFACT_ID: ${{ steps.release.outputs.artifact_id }}
          ARTIFACT_URL: ${{ steps.release.outputs.artifact_url }}
        run: |
          python - <<'PY'
          from datetime import UTC, datetime
          import json, os
          with open("home-assistant-release-artifact-evidence.json", "w", encoding="utf-8") as file:
              json.dump({
                  "schema_version": 1,
                  "kind": "home_assistant_integration_release_artifact",
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "candidate_sha": os.environ["CANDIDATE_SHA"],
                  "artifact_id": os.environ["ARTIFACT_ID"],
                  "artifact_url": os.environ["ARTIFACT_URL"],
                  "artifact_sha256": open("djconnect-home-assistant-integration.sha256", encoding="utf-8").read().strip(),
                  "timestamp": datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              }, file, sort_keys=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-assistant-release-artifact-evidence
          path: home-assistant-release-artifact-evidence.json
          if-no-files-found: error

  reconcile:
    needs: [paid-contextual-golden, package]
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: read
      statuses: write
    uses: pcvantol/djconnect/.github/workflows/post-merge-release-evidence.yml@ebbb35f038a7a3c7d46c12660968bcd50eb67580
    with:
      policy_source_ref: ebbb35f038a7a3c7d46c12660968bcd50eb67580
      required_main_workflow: Validate Home Assistant custom integration
      required_check_contexts: '["Trusted Delivery qualification / Qualify trusted delivery"]'
      repository_role: active_source
      coverage_artifact_name: ha-cobertura-coverage
