name: Home Assistant release artifact

on:
  workflow_run:
    workflows: [Validate Home Assistant custom integration]
    types: [completed]

concurrency:
  group: ha-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paid-contextual-golden:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    uses: ./.github/workflows/askdj-contextual-release-gate.yml
    permissions:
      contents: read
    with:
      candidate_sha: ${{ github.event.workflow_run.head_sha }}
    secrets:
      DJCONNECT_GOLDEN_OPENAI_API_KEY: ${{ secrets.DJCONNECT_GOLDEN_OPENAI_API_KEY }}

  package:
    needs: paid-contextual-golden
    if: >-
      ${{ !cancelled() &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (needs.paid-contextual-golden.result == 'success' ||
      (needs.paid-contextual-golden.result == 'failure' &&
      github.repository == 'pcvantol/djconnect' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - name: Download exact-candidate Ask DJ evidence for the 4.0.0 deferral
        if: needs.paid-contextual-golden.result == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: askdj-contextual-golden-${{ github.event.workflow_run.head_sha }}
          path: golden-evidence
      - name: Verify the temporary Ask DJ deferral
        if: needs.paid-contextual-golden.result == 'failure'
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(date -u +%s)" -lt "$(date -u -d '2026-12-10T00:00:00Z' +%s)"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          jq -e '.version == "4.0.0"' custom_components/djconnect/manifest.json >/dev/null
          report=golden-evidence/askdj-contextual-golden.json
          jq -e --arg sha "$CANDIDATE_SHA" '
            .candidate_sha == $sha and .status == "FAIL" and .release_languages == ["en", "nl"]
            and .executed_help_cases == 60 and .executed_proactive_cases == 560
            and .executed_single_turn_cases == 112
            and (.profiles | length) == 50
            and ([.profiles[].id] | unique | length) == 50
            and all(.profiles[]; .status == "PASS" and .kind == "deterministic_owner_contract")
            and (.findings | length) == 68
            and all(.findings[]; startswith("open_core_qualification:"))
          ' "$report" >/dev/null
          # Pin the sorted finding list from the reviewed 4.0.0 evidence.
          test "$(jq -cS '.findings | sort' "$report" | sha256sum | cut -d' ' -f1)" = \
            5365c521f2c3b2d485e5325981c22e043690a3abf007e18309d83ce6dc5cdbcc
          printf '%s\n' "DJC_ASK_DJ_DEFERRED_REPORT_SHA256=$(sha256sum "$report" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          printf '%s\n' 'Ask DJ release qualification deferred for the 68 recorded 4.0.0 findings.' >> "$GITHUB_STEP_SUMMARY"
      - name: Package the exact integration artifact
        run: |
          set -euo pipefail
          tar -C custom_components --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - djconnect | gzip -n > djconnect-home-assistant-integration.tar.gz
          sha256sum djconnect-home-assistant-integration.tar.gz | awk '{print $1}' > djconnect-home-assistant-integration.sha256
      - id: release
        name: Publish immutable release asset
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="internal-ha-${CANDIDATE_SHA}"
          asset="djconnect-home-assistant-integration-${CANDIDATE_SHA}.tar.gz"
          mv djconnect-home-assistant-integration.tar.gz "$asset"
          notes='Immutable internal deployment artifact.'
          if [ -n "${DJC_ASK_DJ_DEFERRED_REPORT_SHA256:-}" ]; then
            notes="$notes Ask DJ qualification deferred for the 68 recorded Core 4.0.0 findings."
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$CANDIDATE_SHA" --title "DJConnect Home Assistant artifact ${CANDIDATE_SHA}" --prerelease --notes "$notes"
          test "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" = "$CANDIDATE_SHA"
          mkdir -p immutable-readback
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx "$asset"; then
            gh release download "$tag" --pattern "$asset" --dir immutable-readback
            test "$(sha256sum "immutable-readback/$asset" | awk '{print $1}')" = "$(cat djconnect-home-assistant-integration.sha256)"
          else
            gh release upload "$tag" "$asset"
            gh release download "$tag" --pattern "$asset" --dir immutable-readback
            test "$(sha256sum "immutable-readback/$asset" | awk '{print $1}')" = "$(cat djconnect-home-assistant-integration.sha256)"
          fi
          printf 'asset=%s\n' "$asset" >> "$GITHUB_OUTPUT"
          printf 'artifact_id=release-asset:%s:%s:%s\n' "$GITHUB_REPOSITORY" "$tag" "$asset" >> "$GITHUB_OUTPUT"
          printf 'artifact_url=https://github.com/%s/releases/download/%s/%s\n' "$GITHUB_REPOSITORY" "$tag" "$asset" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: djconnect-home-assistant-integration-${{ github.event.workflow_run.head_sha }}
          path: ${{ steps.release.outputs.asset }}
          if-no-files-found: error
      - name: Publish artifact evidence
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          ARTIFACT_ID: ${{ steps.release.outputs.artifact_id }}
          ARTIFACT_URL: ${{ steps.release.outputs.artifact_url }}
        run: |
          python - <<'PY'
          from datetime import UTC, datetime
          import json, os
          deferred_report = os.environ.get("DJC_ASK_DJ_DEFERRED_REPORT_SHA256")
          with open("home-assistant-release-artifact-evidence.json", "w", encoding="utf-8") as file:
              json.dump({
                  "schema_version": 1,
                  "kind": "home_assistant_integration_release_artifact",
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "candidate_sha": os.environ["CANDIDATE_SHA"],
                  "artifact_id": os.environ["ARTIFACT_ID"],
                  "artifact_url": os.environ["ARTIFACT_URL"],
                  "artifact_sha256": open("djconnect-home-assistant-integration.sha256", encoding="utf-8").read().strip(),
                  "ask_dj_qualification": "DEFERRED_CORE_4_0_0" if deferred_report else "PASSED",
                  "ask_dj_deferred_report_sha256": deferred_report,
                  "timestamp": datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              }, file, sort_keys=True)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: home-assistant-release-artifact-evidence
          path: home-assistant-release-artifact-evidence.json
          if-no-files-found: error

  # Canonical active_source evidence qualifies exact main CI/coverage/provenance.
  # Source evidence is separate from artifact publication and installed acceptance.
  reconcile:
    needs: [paid-contextual-golden, package]
    if: ${{ always() && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: read
      statuses: write
    uses: pcvantol/djconnect/.github/workflows/post-merge-release-evidence.yml@ebbb35f038a7a3c7d46c12660968bcd50eb67580
    with:
      policy_source_ref: ebbb35f038a7a3c7d46c12660968bcd50eb67580
      required_main_workflow: Validate Home Assistant custom integration
      required_check_contexts: '["Trusted Delivery qualification / Qualify trusted delivery"]'
      repository_role: active_source
      coverage_artifact_name: ha-cobertura-coverage
