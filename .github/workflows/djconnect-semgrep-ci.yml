name: DJConnect shared Semgrep CI

on:
  workflow_call:
    inputs:
      config:
        description: Semgrep config path or URL.
        required: false
        type: string
        default: "https://raw.githubusercontent.com/pcvantol/djconnect/main/.semgrep/djconnect-security.yml"
      continue-on-error:
        description: Report Semgrep results without failing the workflow.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@b02217ab54ff5a93e9ba5ae406ac608f43ff8792
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect

  semgrep:
    name: Semgrep
    continue-on-error: ${{ inputs.continue-on-error }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: semgrep/semgrep-action@v1
        with:
          config: ${{ inputs.config }}
