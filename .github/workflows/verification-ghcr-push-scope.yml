name: Verification runtime GHCR unique write probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  inspect:
    if: github.actor_id == '19624891' && github.repository_id == '1258575431' && github.repository == 'djconnect-music-dj/djconnect' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - name: Publish one uniquely identified probe manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m tools.verification.ghcr_write_scope_probe
