name: DJConnect shared Home Assistant integration CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for the CI runner.
        required: false
        type: string
        default: "3.11"
      test-command:
        description: Command used to run the repository test suite.
        required: false
        type: string
        default: "python -m unittest discover -s tests"
      run-tests:
        description: Run Python tests.
        required: false
        type: boolean
        default: true
      run-ruff:
        description: Run Ruff linting.
        required: false
        type: boolean
        default: true
      ruff-continue-on-error:
        description: Report Ruff results without failing the workflow.
        required: false
        type: boolean
        default: false
      run-bandit:
        description: Run Bandit security checks.
        required: false
        type: boolean
        default: true
      bandit-continue-on-error:
        description: Report Bandit results without failing the workflow.
        required: false
        type: boolean
        default: false
      run-hassfest:
        description: Run Home Assistant hassfest validation.
        required: false
        type: boolean
        default: true
      run-hacs:
        description: Run HACS repository validation.
        required: false
        type: boolean
        default: true
      run-dependency-audit:
        description: Report available updates for runtime dependencies and CI tools.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@6ff2be61d8cd4041ac4bf21ef622ef330a0bc14a
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect

  dependency-audit:
    if: inputs.run-dependency-audit
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ inputs.python-version }}
      - name: Report dependency and tool update candidates
        run: |
          python -m pip install --upgrade pip
          python - <<'PY' > /tmp/djconnect-runtime-requirements.txt
          import json

          with open("custom_components/djconnect/manifest.json", encoding="utf-8") as handle:
              manifest = json.load(handle)

          for requirement in manifest.get("requirements", []):
              print(requirement)
          PY
          echo "Runtime requirements declared by manifest:"
          cat /tmp/djconnect-runtime-requirements.txt
          python -m pip install -r /tmp/djconnect-runtime-requirements.txt || true
          echo
          echo "Outdated installed runtime packages, if any:"
          python -m pip list --outdated --format=columns || true
          echo
          echo "Latest CI tool versions visible to pip:"
          python -m pip index versions ruff || true
          python -m pip index versions bandit || true

  tests:
    if: inputs.run-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi
          ${{ inputs.test-command }}

  ruff:
    if: inputs.run-ruff
    continue-on-error: ${{ inputs.ruff-continue-on-error }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: Run Ruff
        run: ruff check custom_components/djconnect tests

  bandit:
    if: inputs.run-bandit
    continue-on-error: ${{ inputs.bandit-continue-on-error }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit[toml]
      - name: Run Bandit
        run: bandit -c pyproject.toml -r custom_components/djconnect --severity-level medium

  hassfest:
    if: inputs.run-hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c # master governed exception

  hacs:
    if: inputs.run-hacs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main governed exception
        with:
          category: integration
