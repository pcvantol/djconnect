name: DJConnect shared Home Assistant integration CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for the CI runner.
        required: false
        type: string
        default: "3.x"
      test-command:
        description: Command used to run the repository test suite.
        required: false
        type: string
        default: "python -m unittest discover -s tests"
      run-tests:
        description: Run Python tests.
        required: false
        type: boolean
        default: true
      run-ruff:
        description: Run Ruff linting.
        required: false
        type: boolean
        default: true
      ruff-continue-on-error:
        description: Report Ruff results without failing the workflow.
        required: false
        type: boolean
        default: false
      run-bandit:
        description: Run Bandit security checks.
        required: false
        type: boolean
        default: true
      bandit-continue-on-error:
        description: Report Bandit results without failing the workflow.
        required: false
        type: boolean
        default: false
      run-hassfest:
        description: Run Home Assistant hassfest validation.
        required: false
        type: boolean
        default: true
      run-hacs:
        description: Run HACS repository validation.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  tests:
    if: inputs.run-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run tests
        run: ${{ inputs.test-command }}

  ruff:
    if: inputs.run-ruff
    continue-on-error: ${{ inputs.ruff-continue-on-error }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Run Ruff
        run: ruff check custom_components/djconnect tests

  bandit:
    if: inputs.run-bandit
    continue-on-error: ${{ inputs.bandit-continue-on-error }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install Bandit
        run: python -m pip install bandit[toml]
      - name: Run Bandit
        run: bandit -c pyproject.toml -r custom_components/djconnect --severity-level medium

  hassfest:
    if: inputs.run-hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    if: inputs.run-hacs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
