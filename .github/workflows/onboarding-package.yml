name: Build onboarding package

on:
  pull_request:
    paths:
      - onboarding/**
      - tools/dev_onboarding_*
      - .github/workflows/onboarding-package.yml
  push:
    branches: [main]
    paths:
      - onboarding/**
      - tools/dev_onboarding_*
      - .github/workflows/onboarding-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Linux unit tests
        run: python3 -m unittest onboarding.tests.test_package_build
      - name: Verify tracked distribution artifacts
        run: python3 onboarding/build_package.py --output onboarding/dist --check
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-package-dist
          path: onboarding/dist
          if-no-files-found: error
