name: Build onboarding package

on:
  pull_request:
    paths:
      - onboarding/**
      - tools/dev_onboarding_*
      - .github/workflows/onboarding-package.yml
  push:
    branches: [main]
    paths:
      - onboarding/**
      - tools/dev_onboarding_*
      - .github/workflows/onboarding-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run Linux unit tests
        run: python3 -m unittest onboarding.tests.test_package_build
      - name: Verify tracked distribution artifacts
        run: python3 onboarding/build_package.py --output onboarding/dist --check
      - name: Publish build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onboarding-package-dist
          path: onboarding/dist
          if-no-files-found: error
