name: Validate Home Assistant custom integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@beb68dc935ce8422e7c6c1a1e7eadd61760f289c
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect

  validate:
    uses: ./.github/workflows/djconnect-ha-integration-ci.yml
    with:
      test-command: python -m unittest discover -s tests

  verification-framework-tests:
    name: Verification framework unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install verification test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run verification framework tests
        run: python -m pytest tests/verification

  post-merge-coverage:
    name: Post-merge coverage evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Generate exact-SHA coverage report
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          coverage run -m unittest discover -s tests
          coverage xml -o coverage.xml
          printf '%s\n' "$GITHUB_SHA" > coverage-main-sha.txt
      - name: Upload post-merge coverage evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ha-cobertura-coverage
          path: |
            coverage.xml
            coverage-main-sha.txt
          if-no-files-found: error

  cleanup-workflow-runs:
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    needs:
      - validate
      - verification-framework-tests
      - post-merge-coverage
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_RUNS: "2"
    steps:
      - name: Delete old completed workflow runs
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          current_run_id="${GITHUB_RUN_ID}"
          current_workflow_id="$(gh api "/repos/${repo}/actions/runs/${current_run_id}" --jq '.workflow_id')"

          gh api "/repos/${repo}/actions/workflows" --paginate --jq '.workflows[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r workflow_id workflow_name; do
            [ -n "${workflow_id}" ] || continue

            keep_limit="${KEEP_RUNS}"
            active_run_count="$(
              {
                gh api "/repos/${repo}/actions/workflows/${workflow_id}/runs?status=queued&per_page=100" \
                  --paginate \
                  --jq '.workflow_runs[] | .id'
                gh api "/repos/${repo}/actions/workflows/${workflow_id}/runs?status=in_progress&per_page=100" \
                  --paginate \
                  --jq '.workflow_runs[] | .id'
              } | awk -v current_run_id="${current_run_id}" '$0 != current_run_id { count++ } END { print count + 0 }'
            )"

            if [ "${workflow_id}" = "${current_workflow_id}" ] || [ "${active_run_count}" -gt 0 ]; then
              keep_limit=$((KEEP_RUNS - 1))
            fi

            deleted_count=0
            mapfile -t run_ids < <(
              gh api "/repos/${repo}/actions/workflows/${workflow_id}/runs?status=completed&per_page=100" \
                --paginate \
                --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id'
            )

            if ((${#run_ids[@]} <= keep_limit)); then
              echo "Workflow '${workflow_name}' (${workflow_id}): no completed runs to delete."
              continue
            fi

            for index in "${!run_ids[@]}"; do
              run_id="${run_ids[$index]}"
              if ((index < keep_limit)) || [ "${run_id}" = "${current_run_id}" ]; then
                continue
              fi

              gh api \
                --method DELETE \
                "/repos/${repo}/actions/runs/${run_id}"
              deleted_count=$((deleted_count + 1))
            done

            echo "Workflow '${workflow_name}' (${workflow_id}): deleted ${deleted_count} completed runs older than the effective keep limit ${keep_limit}."
          done
