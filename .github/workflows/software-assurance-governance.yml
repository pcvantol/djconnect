name: Software Assurance governance

on:
  workflow_call:
    inputs:
      execution_profile:
        description: Canonical Software Assurance execution profile.
        required: true
        type: string
      owner:
        description: Owning repository or platform surface.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-governance:
    name: Validate canonical governance policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pinned canonical policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          repository: pcvantol/djconnect
          ref: 3d7d24a84b3aaacb8f2fb229e09c33da85e0545d
          path: canonical-governance

      - name: Check out caller workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          path: caller-workflow-source

      - name: Validate policy and selected execution profile
        working-directory: canonical-governance
        env:
          EXECUTION_PROFILE: ${{ inputs.execution_profile }}
          OWNER: ${{ inputs.owner }}
        run: |
          set -euo pipefail
          python -m tools.software_assurance.validate
          python - <<'PY'
          import os

          from tools.software_assurance.policy import validate_rollout_candidate

          findings = validate_rollout_candidate(
              {
                  "name": os.environ["OWNER"],
                  "execution_profile": os.environ["EXECUTION_PROFILE"],
                  "policy_version": "1.0.0",
                  "timeout_minutes": 10,
                  "permissions": {"contents": "read"},
                  "concurrency_group": "software-assurance-governance",
                  "action_pinning": "full_length_commit_sha",
              }
          )
          if findings:
              raise SystemExit("; ".join(findings))
          PY

      - name: Require Node 24 or newer for pinned JavaScript actions
        working-directory: canonical-governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.software_assurance.validate_action_runtimes ../caller-workflow-source

      - name: Publish governance summary
        env:
          EXECUTION_PROFILE: ${{ inputs.execution_profile }}
          OWNER: ${{ inputs.owner }}
        run: |
          {
            echo "## Software Assurance governance"
            echo
            echo "- Policy: \`djconnect.software_assurance.ci_governance@1.0.0\`"
            echo "- Execution profile: \`${EXECUTION_PROFILE}\`"
            echo "- Owner: \`${OWNER}\`"
            echo "- Policy source: \`pcvantol/djconnect@3fc4f0835fe4068b73a30c7fb2db3318600a3f6f\`"
          } >> "$GITHUB_STEP_SUMMARY"
