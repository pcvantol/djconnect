name: Semgrep

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@a3989752223863431d5ef50fba60d4e229939c21
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect

  semgrep:
    uses: ./.github/workflows/djconnect-semgrep-ci.yml
    with:
      config: .semgrep/djconnect-security.yml
      continue-on-error: true
