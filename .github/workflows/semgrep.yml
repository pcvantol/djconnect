name: Semgrep

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@beb68dc935ce8422e7c6c1a1e7eadd61760f289c
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect

  semgrep:
    uses: ./.github/workflows/djconnect-semgrep-ci.yml
    with:
      config: .semgrep/djconnect-security.yml
      continue-on-error: true
