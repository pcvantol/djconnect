name: Semgrep

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@c5bd44a670612d85b0e5a24e41721ad43cd6d0e7
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect

  semgrep:
    uses: ./.github/workflows/djconnect-semgrep-ci.yml
    with:
      config: .semgrep/djconnect-security.yml
      continue-on-error: true
