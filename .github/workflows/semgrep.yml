name: Semgrep

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: djconnect-music-dj/djconnect-shared-workflows/.github/workflows/software-assurance-governance-5f12.yml@f87d38ab26a8513a2a1de6f9c98a6b56e3d76ffc
    with:
      execution_profile: balanced
      owner: djconnect-music-dj/djconnect

  semgrep:
    uses: ./.github/workflows/djconnect-semgrep-ci.yml
    with:
      config: .semgrep/djconnect-security.yml
      continue-on-error: true
