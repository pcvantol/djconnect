name: DJConnect shared CodeQL CI

on:
  workflow_call:
    inputs:
      languages:
        description: Comma-separated CodeQL language list, for example "python" or "javascript-typescript".
        required: false
        type: string
        default: "python"

permissions:
  contents: read
  security-events: write

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@211be39392768b24d2e67f442583c885763422c0
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ inputs.languages }}
      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
