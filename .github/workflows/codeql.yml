name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "24 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@211be39392768b24d2e67f442583c885763422c0
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect

  analyze:
    uses: ./.github/workflows/djconnect-codeql-ci.yml
    with:
      languages: python
