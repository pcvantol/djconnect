name: DJConnect shared Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for the CI runner.
        required: false
        type: string
        default: "3.11"
      test-command:
        description: Command used to run the repository test suite.
        required: false
        type: string
        default: "python -m unittest discover -s tests"
      source-path:
        description: Python source path scanned by Ruff and Bandit.
        required: false
        type: string
        default: "custom_components/djconnect"
      test-path:
        description: Test path scanned by Ruff.
        required: false
        type: string
        default: "tests"
      run-tests:
        description: Run the test command.
        required: false
        type: boolean
        default: true
      run-ruff:
        description: Run Ruff linting.
        required: false
        type: boolean
        default: true
      ruff-continue-on-error:
        description: Report Ruff results without failing the workflow.
        required: false
        type: boolean
        default: false
      run-bandit:
        description: Run Bandit security checks.
        required: false
        type: boolean
        default: true
      bandit-continue-on-error:
        description: Report Bandit results without failing the workflow.
        required: false
        type: boolean
        default: false
      run-dependency-audit:
        description: Report available updates for Python dependencies and CI tools.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@3d7d24a84b3aaacb8f2fb229e09c33da85e0545d
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect

  dependency-audit:
    if: inputs.run-dependency-audit
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ inputs.python-version }}
      - name: Report dependency and tool update candidates
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt || true
          elif [ -f pyproject.toml ]; then
            python -m pip install . || true
          else
            echo "No requirements.txt or installable pyproject.toml found; checking CI tools only."
          fi
          echo
          echo "Outdated installed Python packages, if any:"
          python -m pip list --outdated --format=columns || true
          echo
          echo "Latest CI tool versions visible to pip:"
          python -m pip index versions ruff || true
          python -m pip index versions bandit || true

  tests:
    if: inputs.run-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi
          ${{ inputs.test-command }}

  ruff:
    if: inputs.run-ruff
    continue-on-error: ${{ inputs.ruff-continue-on-error }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: Run Ruff
        run: ruff check ${{ inputs.source-path }} ${{ inputs.test-path }}

  bandit:
    if: inputs.run-bandit
    continue-on-error: ${{ inputs.bandit-continue-on-error }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit[toml]
      - name: Run Bandit
        run: bandit -c pyproject.toml -r ${{ inputs.source-path }} --severity-level medium
