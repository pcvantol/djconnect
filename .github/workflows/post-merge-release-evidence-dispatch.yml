name: Post-Merge Release Evidence Dispatch

on:
  workflow_run:
    workflows: [Validate Home Assistant custom integration]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    uses: pcvantol/djconnect/.github/workflows/post-merge-release-evidence.yml@361f02c6fa500d506d6b01a6cb344789678e6451
    with:
      policy_source_ref: 361f02c6fa500d506d6b01a6cb344789678e6451
      required_main_workflow: Validate Home Assistant custom integration
      repository_role: active_source
      coverage_artifact_name: ha-cobertura-coverage
