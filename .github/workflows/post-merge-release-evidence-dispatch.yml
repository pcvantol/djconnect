name: Post-Merge Release Evidence Dispatch

on:
  workflow_run:
    workflows: [Validate Home Assistant custom integration]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    uses: pcvantol/djconnect/.github/workflows/post-merge-release-evidence.yml@5dd8ef52ce51793f8a0b6fc438990ed656c76322
    with:
      policy_source_ref: 5dd8ef52ce51793f8a0b6fc438990ed656c76322
      required_main_workflow: Validate Home Assistant custom integration
      repository_role: active_source
      coverage_artifact_name: ha-cobertura-coverage
