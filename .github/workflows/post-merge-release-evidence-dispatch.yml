name: Post-Merge Release Evidence Dispatch

on:
  workflow_run:
    workflows: [Validate Home Assistant custom integration]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    uses: pcvantol/djconnect/.github/workflows/post-merge-release-evidence.yml@335e32f37f1b4889fb60114a15b6f332afc32121
    with:
      policy_source_ref: 335e32f37f1b4889fb60114a15b6f332afc32121
      required_main_workflow: Validate Home Assistant custom integration
      repository_role: active_source
      coverage_artifact_name: ha-cobertura-coverage
