name: Verification Platform Docker Release

on:
  workflow_dispatch:
    inputs:
      image:
        description: Docker image repository to publish.
        required: true
        default: ghcr.io/djconnect-music-dj/djconnect-verification-platform
      release_sha:
        description: Release SHA to record in image labels and immutable tags. Defaults to the checked-out SHA.
        required: false
        default: ""
      promote_mutable:
        description: Explicitly promote minor and latest aliases after readback.
        required: true
        type: boolean
        default: false
      expected_minor:
        description: Current minor alias digest, or ABSENT.
        required: false
        default: ""
      expected_latest:
        description: Current latest alias digest, or ABSENT.
        required: false
        default: ""
      push:
        description: Push immutable image tags to GHCR.
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "verification-platform-v*"

permissions:
  contents: read

concurrency:
  group: verification-runtime-ghcr-publish
  cancel-in-progress: false

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: djconnect-music-dj/djconnect-shared-workflows/.github/workflows/software-assurance-governance-5f12.yml@f87d38ab26a8513a2a1de6f9c98a6b56e3d76ffc
    with:
      execution_profile: release
      owner: djconnect-music-dj/djconnect

  publish:
    name: Build and publish verification runtime
    needs: software-assurance-governance
    if: github.repository_id == '1258575431' && github.repository == 'djconnect-music-dj/djconnect' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      actions: read
      packages: write
    runs-on: ubuntu-24.04
    env:
      DEFAULT_IMAGE: ghcr.io/djconnect-music-dj/djconnect-verification-platform
      IMAGE_INPUT: ${{ inputs.image }}
      RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
      PUSH_INPUT: ${{ inputs.push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set isolated OCI archive path
        run: echo "OCI_ARCHIVE=$RUNNER_TEMP/verification-runtime.oci.tar" >> "$GITHUB_ENV"
      - name: Set up pinned Buildx builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver: docker-container
          driver-opts: image=moby/buildkit@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Verify pinned Buildx binary
        run: |
          echo "e25d5cd675092bb5d1d03632fdc46cdf3fede7b514dc5f023a105e00d3ce5ad4  $HOME/.docker/cli-plugins/docker-buildx" | sha256sum --check
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run verification framework tests
        run: python -m pytest tests/verification

      - name: Resolve release parameters
        id: release
        shell: bash
        run: |
          set -euo pipefail

          image="${IMAGE_INPUT:-$DEFAULT_IMAGE}"
          release_sha="${RELEASE_SHA_INPUT:-$GITHUB_SHA}"
          runtime_version="$(python - <<'PY'
          from tools.verification.runtime import RUNTIME_VERSION
          print(RUNTIME_VERSION)
          PY
          )"

          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF_NAME" = "verification-platform-v$runtime_version"
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          IMAGE="$image" RELEASE_SHA="$release_sha" RUNTIME_VERSION="$runtime_version" \
          python - <<'PY_GUARD'
          import os
          from tools.verification.ghcr_release_guard import validate_release
          validate_release(repository=os.environ["GITHUB_REPOSITORY"], repository_id=os.environ["GITHUB_REPOSITORY_ID"],
                           image=os.environ["IMAGE"], checkout_sha=os.environ["GITHUB_SHA"],
                           release_sha=os.environ["RELEASE_SHA"], version=os.environ["RUNTIME_VERSION"],
                           publishing=os.environ["GITHUB_EVENT_NAME"] == "push" or os.environ.get("PUSH_INPUT") == "true")
          PY_GUARD

          short_sha="${release_sha:0:12}"
          major_minor="${runtime_version%.*}"

          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "runtime_version=${runtime_version}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${major_minor}" >> "${GITHUB_OUTPUT}"
          echo "tag_version=${image}:${runtime_version}" >> "${GITHUB_OUTPUT}"
          echo "tag_major_minor=${image}:${major_minor}" >> "${GITHUB_OUTPUT}"
          echo "tag_version_sha=${image}:${runtime_version}-${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "tag_sha=${image}:sha-${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "tag_latest=${image}:latest" >> "${GITHUB_OUTPUT}"

      - name: Verify Docker release command
        run: |
          python -m tools.verification.cli docker release \
            --image "${{ steps.release.outputs.image }}" \
            --release-sha "${{ steps.release.outputs.release_sha }}" \
            --dry-run

      - name: Build and load independently verifiable OCI archive
        env:
          IMAGE_VERSION: ${{ steps.release.outputs.tag_version }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          RUNTIME_VERSION: ${{ steps.release.outputs.runtime_version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo=1.13.3+ds1-2ubuntu0.24.04.3
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker buildx build --platform linux/amd64 --provenance=false \
            -f docker/verification-platform/Dockerfile \
            --build-arg BASE_IMAGE=python:3.12-slim \
            --build-arg "VERIFICATION_RUNTIME_VERSION=$RUNTIME_VERSION" \
            --build-arg "RELEASE_SHA=$RELEASE_SHA" \
            --build-arg "BUILD_DATE=$build_date" \
            --output "type=oci,dest=$OCI_ARCHIVE" .
          python -c 'import os; from pathlib import Path; from tools.verification.oci_manifest_digest import manifest_details; print("OCI archive manifest:", manifest_details(Path(os.environ["OCI_ARCHIVE"]))[0])'
          skopeo copy "oci-archive:$OCI_ARCHIVE" "docker-daemon:$IMAGE_VERSION"

      - name: Inspect Docker image labels
        run: |
          set -euo pipefail

          docker image inspect "${{ steps.release.outputs.tag_version }}" \
            --format '{{json .Config.Labels}}' > /tmp/verification-platform-labels.json

          python - <<'PY'
          import json
          from pathlib import Path

          labels = json.loads(Path("/tmp/verification-platform-labels.json").read_text())
          expected = {
              "org.opencontainers.image.title": "DJConnect Verification Platform Runtime",
              "org.opencontainers.image.version": "${{ steps.release.outputs.runtime_version }}",
              "org.opencontainers.image.revision": "${{ steps.release.outputs.release_sha }}",
              "org.opencontainers.image.base.name": "python:3.12-slim",
              "org.opencontainers.image.licenses": "MIT",
          }
          missing = {
              key: value
              for key, value in expected.items()
              if labels.get(key) != value
          }
          if missing:
              raise SystemExit(f"Unexpected verification runtime image labels: {missing}")
          PY

      - name: Smoke test Docker image
        run: |
          set -euo pipefail

          docker run --rm "${{ steps.release.outputs.tag_version }}" config \
            > /tmp/verification-platform-config.json

          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("/tmp/verification-platform-config.json").read_text())
          runtime = config.get("verification_runtime", {})
          expected_version = "${{ steps.release.outputs.runtime_version }}"
          if runtime.get("name") != "djconnect-verification-platform":
              raise SystemExit(f"Unexpected runtime name: {runtime!r}")
          if runtime.get("version") != expected_version:
              raise SystemExit(f"Unexpected runtime version: {runtime!r}")
          if runtime.get("schema_version") != 1:
              raise SystemExit(f"Unexpected runtime schema version: {runtime!r}")
          if config.get("parallel_execution") is not True:
              raise SystemExit("Expected parallel_execution to be true")
          if config.get("test_mode") != "stable":
              raise SystemExit(f"Unexpected test_mode: {config.get('test_mode')!r}")
          PY

      - name: Preserve OCI archive before publication
        if: ${{ github.event_name == 'push' || inputs.push }}
        id: archive_evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-runtime-oci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OCI_ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || inputs.push }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish and verify permitted GHCR tags
        if: ${{ github.event_name == 'push' || inputs.push }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          IMAGE: ${{ steps.release.outputs.image }}
          PROMOTE_MUTABLE: ${{ inputs.promote_mutable }}
          EXPECTED_MINOR: ${{ inputs.expected_minor }}
          EXPECTED_LATEST: ${{ inputs.expected_latest }}
          ARCHIVE_ARTIFACT_ID: ${{ steps.archive_evidence.outputs.artifact-id }}
          ARCHIVE_ARTIFACT_DIGEST: ${{ steps.archive_evidence.outputs.artifact-digest }}
        run: |
          python - <<'PY_PUBLISH'
          import os
          from tools.verification.ghcr_release_guard import publish_from_environment
          from tools.verification.runtime import RUNTIME_VERSION
          publish_from_environment(os.environ["IMAGE"], RUNTIME_VERSION, os.environ["RELEASE_SHA"], os.environ["GITHUB_SHA"])
          PY_PUBLISH

      - name: Retain publication journal
        if: ${{ always() && (github.event_name == 'push' || inputs.push) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghcr-publication-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ghcr-publication-${{ github.run_id }}-${{ github.run_attempt }}.jsonl
          if-no-files-found: warn
