services:
  evidence-helper:
    image: ${DJCONNECT_VERIFICATION_EVIDENCE_IMAGE:-python:3.13-alpine}
    container_name: ${DJCONNECT_VERIFICATION_EVIDENCE_CONTAINER:-djconnect-verification-evidence}
    labels:
      djconnect.verification: "true"
      djconnect.lab.service: "evidence_helper"
    command:
      - python
      - -m
      - http.server
      - "8080"
    volumes:
      - ${DJCONNECT_VERIFICATION_EVIDENCE_DIR:-./artifacts/verification/evidence}:/evidence
    networks:
      - djconnect-verification
    restart: "no"
