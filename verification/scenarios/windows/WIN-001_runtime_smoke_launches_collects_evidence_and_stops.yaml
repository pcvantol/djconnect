id: WIN-001
title: Windows runtime smoke launches collects evidence and stops
description: Verify that the prepared Windows runtime can validate target identity, launch, collect sanitized evidence and stop.
purpose: Protect the Windows verification adapter runtime path before broader Windows client assertions depend on it.
owner: DJConnect Verification
category: Capabilities
subcategory: windows_runtime_smoke
priority: P0
risk: high
verification_level: V4
automation_level: ENVIRONMENT_DEPENDENT
required_components: [Windows Native ARM64]
supported_platforms: [Windows ARM64]
required_locales: [not_applicable]
required_build_types: [Instrumented]
required_capabilities: [windows_runtime]
required_profiles: []
required_backends: []
required_devices: [windows_arm64_vm]
required_environment: [prepared_windows_runtime]
requires:
  capabilities:
    - windows.runtime
    - evidence.storage
  services: []
  integrations: []
  bootstrap:
    - windows.prepared_target
    - windows.client_artifact
  resources:
    vm: windows_arm64
    persistent_storage: false
  hardware:
    - windows_vm
  secrets: []
  persistence: ephemeral
preconditions:
  - A prepared Windows target JSON or local process target is configured.
  - Evidence storage is configured outside production user data.
  - Scenario fixture data is isolated from real user data or explicitly approved for test use.
setup:
  - Load the prepared Windows target JSON from the verification environment.
  - Record selected target, command and artifact metadata without secrets.
steps:
  - number: 1
    action: collect_environment
  - number: 2
    action: validate_target_identity
  - number: 3
    action: collect_app_metadata
  - number: 4
    action: launch_app
  - number: 5
    action: collect_logs
  - number: 6
    action: stop_app
assertions:
  runtime:
    - The selected Windows target is configured and safe for the selected runtime mode.
    - The runtime launch and stop primitives execute only through the thin Windows adapter.
    - Log evidence is collected without exposing secrets.
  privacy:
    - Evidence excludes OAuth tokens, bearer tokens, raw prompts, raw audio, Ask DJ history dumps and Music DNA contents.
expected_results:
  machine:
    - code: windows_runtime_target_validated
      expected: true
    - code: windows_runtime_launch_stop_executed
      expected: true
    - code: windows_runtime_evidence_collected
      expected: true
    - code: privacy_redaction_complete
      expected: true
  human:
    - The prepared Windows runtime path is proven before broader Windows client scenario assertions run.
cleanup:
  - Stop the runtime after evidence collection.
  - Retain only sanitized evidence needed for reporting.
timeouts:
  setup_seconds: 120
  execution_seconds: 180
  cleanup_seconds: 60
retry_policy:
  mode: CONTROLLED_RETRY
  max_attempts: 2
  reason: VM, process launch or local runtime behavior may be transient.
  delay_seconds: 5
artifacts:
  - type: logs
    required: true
    description: Scoped Windows runtime log excerpt for the qualified launch.
    redaction: Remove secrets, raw prompts, raw audio, private history and Music DNA contents.
  - type: environment_snapshot
    required: true
    description: Target, command, artifact and adapter metadata.
privacy_classification: [Internal, Requires redaction]
destructive: false
tags: [windows, windows_arm64, runtime, smoke]
estimated_duration: 3m
manual_actions: []
future_notes:
  - This scenario proves only Windows runtime primitives; product behavior remains owned by later canonical Windows client scenarios.
version: 1
schema_version: "1.0"
