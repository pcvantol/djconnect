id: APPLE-001
title: Apple runtime smoke installs launches and collects evidence
description: Verify that the prepared Apple runtime can install, launch, observe and stop the DJConnect Apple app with sanitized evidence.
purpose: Protect the Apple verification adapter runtime path before broader Apple client assertions depend on it.
owner: DJConnect Verification
category: Capabilities
subcategory: apple_runtime_smoke
priority: P0
risk: high
verification_level: V4
automation_level: ENVIRONMENT_DEPENDENT
required_components: [Apple]
supported_platforms: [iOS]
required_locales: [not_applicable]
required_build_types: [Release-equivalent]
required_capabilities: [apple_runtime]
required_profiles: []
required_backends: []
required_devices: [ios_simulator]
required_environment: [prepared_apple_runtime]
requires:
  capabilities:
    - apple.runtime
    - evidence.storage
  services: []
  integrations: []
  bootstrap:
    - apple.prepared_target
    - apple.release_equivalent_app
  resources:
    simulator: ios
    persistent_storage: false
  hardware: []
  secrets: []
  persistence: ephemeral
preconditions:
  - Apple Runtime Qualification has selected a prepared simulator target.
  - A release-equivalent DJConnect Apple app artifact is available for that target.
  - Evidence storage is configured outside production user data.
setup:
  - Load the prepared Apple target JSON from the verification environment.
  - Record selected Xcode, simulator and app artifact metadata.
steps:
  - number: 1
    action: collect_environment
  - number: 2
    action: discover_simulators
  - number: 3
    action: validate_target_identity
  - number: 4
    action: collect_app_metadata
  - number: 5
    action: install_app
  - number: 6
    action: launch_app
  - number: 7
    action: capture_screenshot
  - number: 8
    action: collect_logs
  - number: 9
    action: terminate_app
assertions:
  runtime:
    - The selected simulator target is discoverable and matches the prepared target JSON.
    - The app artifact can be installed and launched on the selected simulator.
    - Screenshot and scoped log evidence are collected without exposing secrets.
  privacy:
    - Evidence excludes OAuth tokens, bearer tokens, raw prompts, raw audio, Ask DJ history dumps and Music DNA contents.
expected_results:
  machine:
    - code: apple_runtime_target_validated
      expected: true
    - code: apple_app_installed_and_launched
      expected: true
    - code: apple_runtime_evidence_collected
      expected: true
    - code: privacy_redaction_complete
      expected: true
  human:
    - The prepared Apple runtime path is proven before broader Apple client scenario assertions run.
cleanup:
  - Terminate the app after evidence collection.
  - Retain only sanitized evidence needed for reporting.
timeouts:
  setup_seconds: 120
  execution_seconds: 180
  cleanup_seconds: 60
retry_policy:
  mode: CONTROLLED_RETRY
  max_attempts: 2
  reason: Simulator boot, install or launch behavior may be transient.
  delay_seconds: 5
artifacts:
  - type: screenshot
    required: true
    description: Simulator screenshot proving the app launched.
    redaction: Screenshot must not expose secrets, raw prompts, private history or Music DNA contents.
  - type: logs
    required: true
    description: Scoped simulator log excerpt for the qualified launch.
    redaction: Remove secrets, raw prompts, raw audio, private history and Music DNA contents.
  - type: environment_snapshot
    required: true
    description: Xcode, simulator, app artifact and adapter metadata.
privacy_classification: [Internal, Requires redaction]
destructive: false
tags: [apple, ios, simulator, runtime, smoke]
estimated_duration: 3m
manual_actions: []
future_notes:
  - This scenario proves only Apple runtime primitives; product behavior remains owned by later canonical Apple client scenarios.
version: 1
schema_version: "1.0"
