version: 1
capabilities:
  ha.runtime:
    description: Home Assistant runtime is running and reachable.
    owner: Verification Execution Environment
    provided_by: [homeassistant]
    dependencies: [docker.runtime]
    readiness_probe: ha_http_root
    evidence: [container_metadata, ha_version]
    resource_type: local
    emulatable: false
    blocking: true
  ha.rest:
    description: Home Assistant REST API accepts authenticated requests.
    owner: Verification Execution Environment
    provided_by: [homeassistant]
    dependencies: [ha.runtime, ha.access_token]
    readiness_probe: ha_rest_api
    evidence: [request_response]
    resource_type: local
    emulatable: false
    blocking: true
  ha.websocket:
    description: Home Assistant WebSocket API accepts authenticated commands.
    owner: Verification Execution Environment
    provided_by: [homeassistant]
    dependencies: [ha.runtime, ha.access_token]
    readiness_probe: ha_websocket_get_config
    evidence: [websocket_transcript]
    resource_type: local
    emulatable: false
    blocking: true
  ha.services:
    description: Home Assistant service registry can execute service calls.
    owner: Verification Execution Environment
    provided_by: [homeassistant]
    dependencies: [ha.rest, ha.websocket]
    readiness_probe: ha_service_registry
