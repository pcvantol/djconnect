[tool.ruff]
target-version = "py312"
line-length = 100
src = ["custom_components", "tests", "tools"]
extend-exclude = [
    ".git",
    ".github",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "S105",
    "S106",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = [
    "B101",
    "B105",
    "B106",
]
